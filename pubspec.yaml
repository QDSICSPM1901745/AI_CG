name: ai_career_guide
description: AI Career Guide - Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  curved_navigation_bar: ^1.0.3
  awesome_dialog: ^3.2.1
  flutter_markdown: ^0.7.7+1

  # Network
  http: ^1.2.1

  # Storage
  shared_preferences: ^2.2.2
  image_picker: ^1.2.1
  file_picker: ^11.0.3

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^20.1.0
  url_launcher: ^6.3.2

  # PDF
  syncfusion_flutter_pdf: ^24.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true